# ==============================================================================
# == SQUID - AMBIENTE EDUCACIONAL SENAI (WHITELIST / DEFAULT-DENY)            ==
# == Squid 6.13 | CT101 | 10.0.0.5 | America/Sao_Paulo                        ==
# == Revisao: 16/09/2026                                                      ==
# ==============================================================================
#
# Modelo: nada passa por padrao. So o que esta em sites_permitidos.txt.
#
# Dois caminhos de entrada durante a transicao:
#   3128 - via stream 8101 do NPM, sem PROXY protocol -> origem = 10.0.0.2
#   3129 - via stream 8150 do NPM, com PROXY protocol -> origem = IP real
# Ver a secao LIMPEZA no fim do arquivo.

# --- BIND E IDENTIDADE --------------------------------------------------------
#http_port 10.0.0.5:3128                       # caminho antigo (via 8101)
http_port 10.0.0.5:3129 require-proxy-header  # caminho novo   (via 8150)

# Aceita cabecalho PROXY apenas do CT100. Outra origem tentando falsificar
# o IP do cliente e recusada.
acl npm_upstream src 10.0.0.2
proxy_protocol_access allow npm_upstream
proxy_protocol_access deny all

max_filedescriptors 16384
visible_hostname squid.senai.local
error_default_language pt-br

# --- CACHE --------------------------------------------------------------------
# Quase todo o trafego e HTTPS via CONNECT (tunel opaco) e nao e cacheavel.
# Aumentar cache_mem so ajuda se houver TCP_HIT relevante:
#   grep -c TCP_HIT /var/log/squid/access.log
cache_mem 256 MB
maximum_object_size_in_memory 512 KB
maximum_object_size 50 MB

# Cache em disco desativado. Para reativar: descomente, pare o servico,
# rode "squid -z", e so entao reinicie.
#cache_dir ufs /var/spool/squid 10000 16 256

# --- POLITICAS DE REFRESH -----------------------------------------------------
refresh_pattern ^ftp:                             1440  20%  10080
refresh_pattern ^gopher:                          1440   0%   1440
refresh_pattern -i (/cgi-bin/|\?)                    0   0%      0
refresh_pattern -i \.(jpg|jpeg|png|gif|css|js)$  10080  90%  43200
refresh_pattern .                                    0  20%   4320

# ==============================================================================
# == ACLs                                                                     ==
# ==============================================================================

# --- Origem -------------------------------------------------------------------
# 10.0.0.2        = CT100 (npm-proxy), caminho antigo. REMOVER apos o cutover.
# 10.137.144.0/24 = notebooks dos alunos.
#acl localnet src 10.0.0.2
acl localnet src 10.137.144.0/24

# --- Portas -------------------------------------------------------------------
acl SSL_ports port 443
acl Safe_ports port 80          # http
acl Safe_ports port 21          # ftp
acl Safe_ports port 443         # https
acl Safe_ports port 70          # gopher
acl Safe_ports port 210         # wais
acl Safe_ports port 1025-65535  # portas nao registradas
acl Safe_ports port 280         # http-mgmt
acl Safe_ports port 488         # gss-http
acl Safe_ports port 591         # filemaker
acl Safe_ports port 777         # multiling http

# --- Listas de dominios -------------------------------------------------------
# As ACLs abaixo apenas DEFINEM as listas. Quais delas sao negadas ou
# liberadas depende das regras mais adiante e do modo.conf.
# NAO remova "redes_sociais" e "sites_ia": o modo.conf as referencia.
acl allowed_sites                dstdomain "/etc/squid/sites_permitidos.txt"
acl ruido                        dstdomain "/etc/squid/sites_ruido.txt"
acl redes_sociais                dstdomain "/etc/squid/sites_redes_sociais.txt"
acl sites_ia                     dstdomain "/etc/squid/sites_ia.txt"
acl sites_prova                  dstdomain "/etc/squid/sites_prova.txt"

# Sistema proprio de prova: 10.187.226.125:8104
# Precisa de ACL por IP (dst), nao dstdomain - o Squid nao casa endereco
# literal com dstdomain. A porta entra separada para nao liberar o host
# inteiro, que e o mesmo alias do proxy.
#
# Observacao: a faixa 10.187.226.* esta na bypass list dos notebooks, entao
# normalmente este trafego nem chega ao Squid. Esta ACL e rede de seguranca
# para o caso de o bypass falhar - notadamente no Firefox, cujo Passthrough
# nao entende curinga com asterisco.
acl sistema_prova                dst 10.187.226.125
acl porta_prova                  port 8104
acl sites_horario_controlado     dstdomain "/etc/squid/sites_horario_controlado.txt"
acl sites_sincronismo_controlado dstdomain "/etc/squid/sites_sincronismo_controlado.txt"
acl sites_contorno               dstdomain "/etc/squid/sites_contorno.txt"
acl google_jogos                 url_regex -i "/etc/squid/sites_jogos_bloqueados.txt"

# --- Janelas de horario -------------------------------------------------------
# Dias: S=Dom M=Seg T=Ter W=Qua H=Qui F=Sex A=Sab
# Linhas com o mesmo nome de ACL sao somadas (OR).
#
# CONFIRA O FUSO DO CONTAINER: precisa ser America/Sao_Paulo. Em Etc/UTC
# todas as janelas ficam deslocadas em 3 horas. Verifique com "date".

# Horario de AULA - e quando o acesso ao ead/ava/livre fica proibido.
# A logica e invertida de proposito: descrever a aula e mais curto e mais
# seguro do que enumerar todas as janelas livres (almoco, apos as 16h,
# madrugada, fim de semana). Fora destas faixas, o acesso e normal.
acl horario_aula time MTWHF 07:00-11:00
acl horario_aula time MTWHF 12:00-16:00

# Janelas de sincronismo de arquivos (OneDrive/SharePoint)
acl horario_sincronismo time MTWHF 09:15-09:40
acl horario_sincronismo time MTWHF 10:50-12:20
acl horario_sincronismo time MTWHF 14:15-14:40

# ==============================================================================
# == REGRAS DE ACESSO                                                         ==
# ==                                                                          ==
# == A ORDEM E DECISIVA. O Squid para na PRIMEIRA regra que casa. Todo deny   ==
# == especifico precisa vir ANTES de "allow localnet allowed_sites".          ==
# ==============================================================================

# --- 1. Protecoes basicas -----------------------------------------------------
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

http_access allow localhost manager
http_access deny manager

http_access deny to_localhost

# --- 2. Corte de origem -------------------------------------------------------
http_access deny !localnet !localhost

# --- 3. Corte de ruido --------------------------------------------------------
# Telemetria e clientes automaticos que reconectam em loop ao receber 403.
# Chegaram a ~80% das requisicoes processadas. Barrados aqui, no inicio da
# cadeia, para nao percorrerem todas as regras a cada tentativa.
#
# VENCE O TOGGLE: por vir antes do modo.conf, permanece bloqueado em
# QUALQUER combinacao, ate em "aberto +ia +social". E o caso de .bing.com
# - ver a nota em sites_ruido.txt sobre o Copilot.
http_access deny localnet ruido

# --- 3b. Redes sociais - CONTROLE MOVIDO PARA O modo.conf ---------------------
# Esta regra era fixa aqui. Foi desativada de proposito.
#
# O deny de redes sociais agora e escrito pelo proxy-modo.sh dentro do
# modo.conf, sempre que a flag +social NAO for usada. Isso permite liberar
# redes sociais temporariamente sem editar este arquivo em producao.
#
# NAO REATIVE a linha abaixo: ela venceria o modo.conf e a flag +social
# deixaria de funcionar, sem erro aparente.
#
#http_access deny localnet redes_sociais

# --- 3c. Horario controlado: ead / ava / livre --------------------------------
# VENCE O TOGGLE. Esta regra fica aqui, antes do include, porque o acesso a
# essas plataformas nao deve acontecer em horario de aula em NENHUMA
# circunstancia - nem em "aberto", nem em "aberto +ia +social".
#
# Se estivesse depois do include, o allow amplo da base "aberto" casaria
# primeiro e liberaria o ead durante a aula.
#
# Fora do horario de aula o acesso e normal: cai no allow da whitelist,
# ja que ".senai.br" consta em sites_permitidos.txt.
http_access deny localnet sites_horario_controlado horario_aula

# --- 4. MODO DINAMICO ---------------------------------------------------------
# Arquivo gerado por /root/proxy-modo.sh. NAO EDITAR A MAO.
#
# O script trabalha com tres BASES e tres FLAGS:
#
#   BASES    bloqueado  nada passa                  (provas)
#            restrito   so a whitelist passa        (padrao de aula)
#            aberto     tudo passa, sem whitelist
#
#   FLAGS    +ia        libera sites_ia.txt
#            +social    libera sites_redes_sociais.txt
#            +prova     libera sites_prova.txt (so com a base "bloqueado")
#
# Sem flag, a categoria fica bloqueada - inclusive na base "aberto".
# Exemplos: "restrito +ia", "bloqueado +prova 90", "aberto +ia +social".
#
# O conteudo gerado difere conforme a base: em "restrito" as flags viram
# allows adicionais; em "aberto" existe um allow amplo, e o que NAO foi
# liberado por flag e negado ANTES dele. Nao reproduza isso a mao.
#
# Cada execucao reescreve o arquivo por inteiro - os modos nao se somam.
# Todos aceitam IPs (aplica so a certas maquinas) e um prazo em minutos,
# apos o qual o Squid volta sozinho para "restrito".
#
# Se o arquivo nao existir, o Squid NAO INICIA. Recriar com:
#   /root/proxy-modo.sh restrito
#
# Posicao: depois dos cortes fixos (3, 3b, 3c) e antes das negacoes 5a-5b,
# para que as liberacoes sobreponham sincronismo e contorno. O horario
# controlado do ead/ava NAO e sobreponivel: foi movido para a regra 3c,
# antes deste include.
include /etc/squid/modo.conf

# --- 5. NEGACOES --------------------------------------------------------------

# 5a. Endpoints de sincronismo fora da janela.
#     A lista contem APENAS endpoints de transferencia de arquivo.
#     NAO adicionar dominios de autenticacao Microsoft (.microsoft.com,
#     .microsoftonline.com, .live.com, .windows.net): nega-los fora da
#     janela derrubaria login, Azure e Teams o dia inteiro.
#
#     Esta regra fica DEPOIS do include, entao a base "aberto" a sobrepoe.
#     Se o controle de sincronismo tambem precisar ser inegociavel, mova
#     para junto da 3c.
http_access deny localnet sites_sincronismo_controlado !horario_sincronismo

# 5b. Servicos de contorno hospedados sob dominios da whitelist.
#     translate.google.com, meet, chat, outlook.live.com. Sem este deny,
#     ficariam liberados por heranca de .google.com e .live.com.
http_access deny localnet sites_contorno

# 5c. [DESATIVADA] Jogos por padrao de URL.
#     Em HTTPS o Squid so ve "host:443" no CONNECT, entao padroes de path
#     nunca sao avaliados - bloqueava quase nada e custava CPU em cada
#     requisicao.
#
#     Para reativar sem custo em HTTPS (o !CONNECT falha primeiro e os
#     regex nem chegam a rodar em trafego TLS):
#
#http_access deny localnet !CONNECT google_jogos
#
#     O controle efetivo de jogos e busca deve ser feito por DNS, no
#     resolvedor interno (10.187.226.5):
#       www.google.com   CNAME  forcesafesearch.google.com
#       www.youtube.com  CNAME  restrictmoderate.youtube.com

# --- 6. LIBERACOES ------------------------------------------------------------
http_access allow localnet sites_sincronismo_controlado horario_sincronismo
http_access allow localnet allowed_sites
http_access allow localhost

# --- 7. Regra final -----------------------------------------------------------
http_access deny all

# ==============================================================================
# == CABECALHOS E PRIVACIDADE                                                 ==
# ==============================================================================
forwarded_for off
via off
request_header_access Via deny all
request_header_access X-Forwarded-For deny all
request_header_access From deny all
request_header_access Referer deny all
# User-Agent mantido: remove-lo quebra compatibilidade com varios sites.
#request_header_access User-Agent deny all

# O aviso "WARNING: HTTP requires the use of Via" no squid -k parse vem do
# "via off" acima. E esperado e inofensivo.

# ==============================================================================
# == INCLUDES                                                                 ==
# ==============================================================================
# conf.d/ contem apenas debian.conf, sem regra de acesso ativa - por isso a
# posicao no fim do arquivo e inofensiva. Se algum .conf ali passar a definir
# http_access, mova este include para ANTES da secao de regras.
include /etc/squid/conf.d/*.conf

# ==============================================================================
# == LIMPEZA PENDENTE - CUTOVER DO CAMINHO ANTIGO                             ==
# ==============================================================================
# O PROXY protocol ja esta ativo e validado (stream 8150 -> 3129).
#
# Confirmar que nao ha mais trafego legitimo vindo do caminho antigo:
#   tail -f /var/log/squid/access.log | grep 10.0.0.2
#
# Depois de alguns dias limpos:
#   1) Remover deste arquivo:  http_port 10.0.0.5:3128
#                              acl localnet src 10.0.0.2
#   2) Deletar o stream 8101 na interface do NPM.
#   3) squid -k parse && systemctl restart squid
#      (restart, nao reconfigure: fechar porta de escuta exige restart)
#
# NAO REMOVER "acl npm_upstream src 10.0.0.2" nem as linhas de
# proxy_protocol_access. Elas nao pertencem ao caminho antigo - sao o que
# autoriza o CT100 a enviar o cabecalho PROXY na porta 3129.